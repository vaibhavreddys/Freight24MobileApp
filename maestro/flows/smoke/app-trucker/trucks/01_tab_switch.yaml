# maestro/flows/smoke/app-trucker/trucks/01_tab_switch.yaml
#
# Trucks tab: switching tabs renders the trucks list with its status filter
# chips ("Available") and the board comes back intact when returning to
# Loads.
# @smoke @trucks
#
# Run:  ./run.sh flows/smoke/app-trucker/trucks/01_tab_switch.yaml
appId: com.freight24.trucker.debug
---
- runFlow: ../../../_helpers/ensure_login_trucker.yaml
- runFlow:
    env:
      TAB_ID: "trucks"
      EXPECT_TEXT: "Available"
    commands:
      - runFlow: ../../../_helpers/open_tab.yaml
- runFlow:
    env:
      TAB_ID: "loads"
      EXPECT_TEXT: ""
    commands:
      - runFlow: ../../../_helpers/open_tab.yaml
- runFlow: ../../../_helpers/assert_load_board.yaml
