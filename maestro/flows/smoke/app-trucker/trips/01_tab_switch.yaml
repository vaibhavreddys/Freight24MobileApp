# maestro/flows/smoke/app-trucker/trips/01_tab_switch.yaml
#
# Trips tab: switching tabs renders the trips dashboard ("My Trips") and the
# board comes back intact when returning to Loads.
# @smoke @trips
#
# Run:  ./run.sh flows/smoke/app-trucker/trips/01_tab_switch.yaml
appId: com.freight24.trucker.debug
---
- runFlow: ../../../_helpers/ensure_login_trucker.yaml
- runFlow:
    env:
      TAB_ID: "trips"
      EXPECT_TEXT: "My Trips"
    commands:
      - runFlow: ../../../_helpers/open_tab.yaml
- runFlow:
    env:
      TAB_ID: "loads"
      EXPECT_TEXT: ""
    commands:
      - runFlow: ../../../_helpers/open_tab.yaml
- runFlow: ../../../_helpers/assert_load_board.yaml
