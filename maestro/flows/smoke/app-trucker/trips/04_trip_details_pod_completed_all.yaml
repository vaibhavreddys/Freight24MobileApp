# maestro/flows/smoke/app-trucker/trips/04_trip_details_pod_completed_all.yaml
#
# Trips tab, remaining filters (POD, COMPLETED, ALL): for each filter that
# lists trips, the first card opens Trip Details and the full walkthrough
# runs (Documents → Payments expand/scroll/collapse → Trip Timeline
# expand/scroll → back). Filters with no trips just assert their empty state.
#
# @smoke @trips
#
# Run:  ./run.sh flows/smoke/app-trucker/trips/04_trip_details_pod_completed_all.yaml
appId: com.freight24.trucker.debug
---
- runFlow: ../../../_helpers/ensure_login_trucker.yaml
- runFlow:
    env:
      TAB_ID: "trips"
      EXPECT_TEXT: "My Trips"
    commands:
      - runFlow: ../../../_helpers/open_tab.yaml

# ── POD ──────────────────────────────────────────────────────────────────────
- tapOn:
    id: "trips_filter_pod"
- waitForAnimationToEnd:
    timeout: 4000
- runFlow:
    when:
      visible:
        id: "trip_card"
    commands:
      - runFlow:
          env:
            LOG_MESSAGE: "Trips POD: trip cards listed, opening first card"
            SETTLE_MS: "2500"
          commands:
            - runFlow: ../../../_helpers/log_and_settle.yaml
      - tapOn:
          id: "trip_card"
          index: 0
      - waitForAnimationToEnd:
          timeout: 10000
      - assertVisible:
          text: "Trip Details"
      - runFlow:
          env:
            LOG_MESSAGE: "Trips POD: Trip Details screen opened"
            SETTLE_MS: "3000"
          commands:
            - runFlow: ../../../_helpers/log_and_settle.yaml
      - runFlow: ../../../_helpers/trip_details_walkthrough.yaml
- runFlow:
    when:
      notVisible:
        id: "trip_card"
    commands:
      - assertVisible: "No POD Trips Available"
      - runFlow:
          env:
            LOG_MESSAGE: "Trips POD: no trips, details drill skipped (pass)"
            SETTLE_MS: "2500"
          commands:
            - runFlow: ../../../_helpers/log_and_settle.yaml

# ── COMPLETED ────────────────────────────────────────────────────────────────
- tapOn:
    id: "trips_filter_completed"
- waitForAnimationToEnd:
    timeout: 4000
- runFlow:
    when:
      visible:
        id: "trip_card"
    commands:
      - runFlow:
          env:
            LOG_MESSAGE: "Trips COMPLETED: trip cards listed, opening first card"
            SETTLE_MS: "2500"
          commands:
            - runFlow: ../../../_helpers/log_and_settle.yaml
      - tapOn:
          id: "trip_card"
          index: 0
      - waitForAnimationToEnd:
          timeout: 10000
      - assertVisible:
          text: "Trip Details"
      - runFlow:
          env:
            LOG_MESSAGE: "Trips COMPLETED: Trip Details screen opened"
            SETTLE_MS: "3000"
          commands:
            - runFlow: ../../../_helpers/log_and_settle.yaml
      - runFlow: ../../../_helpers/trip_details_walkthrough.yaml
- runFlow:
    when:
      notVisible:
        id: "trip_card"
    commands:
      - assertVisible: "No Completed Trips Available"
      - runFlow:
          env:
            LOG_MESSAGE: "Trips COMPLETED: no trips, details drill skipped (pass)"
            SETTLE_MS: "2500"
          commands:
            - runFlow: ../../../_helpers/log_and_settle.yaml

# ── ALL ──────────────────────────────────────────────────────────────────────
- tapOn:
    id: "trips_filter_all"
- waitForAnimationToEnd:
    timeout: 4000
- runFlow:
    when:
      visible:
        id: "trip_card"
    commands:
      - runFlow:
          env:
            LOG_MESSAGE: "Trips ALL: trip cards listed, opening first card"
            SETTLE_MS: "2500"
          commands:
            - runFlow: ../../../_helpers/log_and_settle.yaml
      - tapOn:
          id: "trip_card"
          index: 0
      - waitForAnimationToEnd:
          timeout: 10000
      - assertVisible:
          text: "Trip Details"
      - runFlow:
          env:
            LOG_MESSAGE: "Trips ALL: Trip Details screen opened"
            SETTLE_MS: "3000"
          commands:
            - runFlow: ../../../_helpers/log_and_settle.yaml
      - runFlow: ../../../_helpers/trip_details_walkthrough.yaml
- runFlow:
    when:
      notVisible:
        id: "trip_card"
    commands:
      - assertVisible: "No All Trips Available"
      - runFlow:
          env:
            LOG_MESSAGE: "Trips ALL: no trips, details drill skipped (pass)"
            SETTLE_MS: "2500"
          commands:
            - runFlow: ../../../_helpers/log_and_settle.yaml
