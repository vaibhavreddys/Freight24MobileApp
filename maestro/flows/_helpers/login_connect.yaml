# maestro/flows/_helpers/login_connect.yaml
#
# Connect login helper. Requires env (supplied by maestro/run.sh):
#   PHONE_NUMBER - 10-digit mobile number for a connect user, e.g. 9880300300
#   BASE_URL     - backend base URL
#
# OTP comes from the backend's dev-only endpoint (DEVELOPMENT_MODE=true).
# NOTE: not yet exercised on a device — app-connect flows are not in scope yet;
# this was ported when the notification-shade capture helper was removed.
#
# The app auto-submits the phone number once it has the expected number
# of digits, so the Send OTP button is often already-clicked (or never
# visible) by the time we get to it. The flow handles both cases.
#
# SELECTORS USED (test tags in app-connect Compose code):
#   phone_input / otp_input / send_otp_btn / verify_btn
appId: com.freight24.connect.debug
---
- runFlow: ./dismiss_system_prompts.yaml
- tapOn:
    id: "phone_input"
- inputText: '${PHONE_NUMBER}'
- tapOn:
    id: "send_otp_btn"
    optional: true
- evalScript: "${(function(){ let otp=''; try { const res = http.get(BASE_URL + 'auth/dev/last-otp?phone_number=%2B91' + PHONE_NUMBER); const body = typeof res.body === 'string' ? JSON.parse(res.body) : res.body; if (body && body.otp_code) otp = body.otp_code; } catch(e) { console.log('OTP fetch failed: ' + e); } output.otp = otp; return 'OTP from backend: ' + otp; })()}"
- assertTrue:
    label: 'OTP was fetched from backend (is the server running restart-dev?)'
    condition: ${output.otp != ''}
- tapOn:
    id: "otp_input"
- inputText: "${output.otp.charAt(0)}"
- inputText: "${output.otp.charAt(1)}"
- inputText: "${output.otp.charAt(2)}"
- inputText: "${output.otp.charAt(3)}"
- inputText: "${output.otp.charAt(4)}"
- inputText: "${output.otp.charAt(5)}"
- tapOn:
    id: "verify_btn"
- runFlow:
    env:
      HOME_TEXT: "Home|Trips|Trucks|Profile"
    commands:
      - runFlow: ./assert_home_loaded.yaml
