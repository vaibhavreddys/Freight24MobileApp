image: gradle:8.4-jdk17

variables:
  ANDROID_SDK_ROOT: "/sdk"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

cache:
  key: gradle-cache
  paths:
    - .gradle/
    - /sdk/

stages:
  - build
  - deploy

before_script:
  - apt-get update -qq
  - apt-get install -y wget unzip
  - mkdir -p $ANDROID_SDK_ROOT
  - wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
  - unzip -q commandlinetools-linux-*.zip -d $ANDROID_SDK_ROOT
  - set +o pipefail
  - yes | $ANDROID_SDK_ROOT/cmdline-tools/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT --licenses
  - set -o pipefail
  - $ANDROID_SDK_ROOT/cmdline-tools/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "platforms;android-36" "build-tools;36.0.0"

# -----------------------------
# BUILD (QA DEBUG)
# -----------------------------

build:trucker:qaDebug:
  stage: build
  script:
    - ./gradlew :app-trucker:assembleQaDebug
  artifacts:
    paths:
      - app-trucker/build/outputs/apk/qa/debug/
    expire_in: 1 week  # keep artifacts around long enough for deploy stage

build:connect:qaDebug:
  stage: build
  script:
    - ./gradlew :app-connect:assembleQaDebug
  artifacts:
    paths:
      - app-connect/build/outputs/apk/qa/debug/
    expire_in: 1 week

# -----------------------------
# DEPLOY — GitLab Release
# -----------------------------

deploy:release:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/release-cli:latest  # switch image just for this job
  before_script:  # override the global before_script — no Android SDK needed here
    - apk add --no-cache curl
  needs:
    - job: build:trucker:qaDebug
      artifacts: true
    - job: build:connect:qaDebug
      artifacts: true
  script:
    # Upload APKs as Generic Package Registry files so they get a stable URL
    - |
      curl --fail \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --upload-file app-trucker/build/outputs/apk/qa/debug/app-trucker-qa-debug.apk \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/apk-builds/${CI_COMMIT_SHORT_SHA}/app-trucker-qa-debug.apk"
    - |
      curl --fail \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --upload-file app-connect/build/outputs/apk/qa/debug/app-connect-qa-debug.apk \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/apk-builds/${CI_COMMIT_SHORT_SHA}/app-connect-qa-debug.apk"
  release:
    name: "QA Debug — $CI_COMMIT_SHORT_SHA"
    description: |
      Automated QA debug build from branch `$CI_COMMIT_REF_NAME`.
      Commit: $CI_COMMIT_SHA
    tag_name: "qa-debug-$CI_COMMIT_SHORT_SHA"  # creates a new tag per build
    assets:
      links:
        - name: "app-trucker-qa-debug.apk"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/apk-builds/${CI_COMMIT_SHORT_SHA}/app-trucker-qa-debug.apk"
          link_type: package
        - name: "app-connect-qa-debug.apk"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/apk-builds/${CI_COMMIT_SHORT_SHA}/app-connect-qa-debug.apk"
          link_type: package
  only:
